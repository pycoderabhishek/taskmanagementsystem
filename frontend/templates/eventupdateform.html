{% extends 'base.html' %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="py-20">
    <div class="max-w-lg mx-auto px-6">
        <div class="bg-[#BDD8E9] rounded-xl shadow-lg p-8 text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
                <svg class="h-6 w-6 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Delete Event</h2>
            <p class="text-slate-500 mt-2">Are you sure you want to delete the event "{{ event.name }}"? This action cannot be undone.</p>
            <form method="post" class="mt-6">
                {% csrf_token %}
                <div class="flex gap-4">
                    <a href="{% url 'homepage' %}" class="flex-1 text-center bg-slate-100 text-slate-700 font-semibold py-2 px-4 rounded-lg hover:bg-slate-200 transition">Cancel</a>
                    <button type="submit" class="flex-1 text-center bg-red-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-700 transition">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
